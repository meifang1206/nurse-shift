<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>護理師刷卡排班表（多人同步版）</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      margin: 16px;
      background: #f5f6f8;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px 0;
    }
    .panel {
      background: #fff;
      border: 1px solid #dfe3e8;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .panel-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #1e3a8a;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
    }
    .tag.holiday-tag {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .tag button {
      background: none;
      border: none;
      color: #dc2626;
      font-weight: bold;
      cursor: pointer;
      padding: 0 2px;
      font-size: 14px;
    }
    .row-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    input, select, button {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      background: #fff;
    }
    button {
      cursor: pointer;
    }
    button:disabled, input:disabled, select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    button.primary {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    button.danger {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }
    button.secondary {
      background: #e2e8f0;
      color: #1e293b;
      border-color: #cbd5e1;
    }
    button.lock-btn.unlocked {
      background: #fef3c7;
      color: #92400e;
      border-color: #fcd34d;
      font-weight: 600;
    }
    button.lock-btn.locked {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
      font-weight: 700;
    }
    .support-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      color: #92400e;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .lock-banner {
      display: none;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      color: #92400e;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .lock-banner.show {
      display: block;
    }
    .badge {
      font-weight: 600;
      font-size: 13px;
      color: #334155;
      background: #f1f5f9;
      padding: 5px 10px;
      border-radius: 6px;
    }
    .status {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
    }
    .status.loading {
      background: #eff6ff;
      color: #1d4ed8;
    }
    .status.err {
      background: #fef2f2;
      color: #b91c1c;
    }
    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #dfe3e8;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 6px;
      text-align: center;
      vertical-align: middle;
    }
    th {
      background: #f8fafc;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tr.weekend td:first-child,
    tr.weekend td:nth-child(2) {
      color: #b91c1c;
      background: #fef2f2;
      font-weight: 600;
    }
    tr.holiday td:first-child,
    tr.holiday td:nth-child(2) {
      color: #991b1b;
      background: #fee2e2;
      font-weight: 700;
    }
    td.conflict-cell {
      background: #fef08a !important;
    }
    .holiday-name {
      display: block;
      font-size: 11px;
      color: #b91c1c;
      font-weight: 600;
      margin-top: 2px;
    }
    .custom-note {
      display: block;
      font-size: 11px;
      color: #1d4ed8;
      font-weight: 600;
      margin-top: 2px;
    }
    .conflict-note {
      display: block;
      font-size: 11px;
      color: #9a3412;
      font-weight: 700;
      margin-top: 2px;
    }
    .avail-cell {
      min-width: 150px;
      max-width: 240px;
      text-align: left !important;
      font-size: 12px;
      line-height: 1.4;
      color: #334155;
      background: #fafafa;
    }
    .avail-empty {
      color: #b91c1c;
      font-weight: 700;
    }
    td select {
      width: 100%;
      min-width: 96px;
      padding: 5px 4px;
      font-size: 13px;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
      color: #1e293b;
    }
    .note {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>護理師刷卡排班表（多人同步版）</h1>

  <div id="lockBanner" class="lock-banner">
    目前排班表已設定為「僅供檢視（已鎖定）」，所有欄位與調整功能已停用，避免誤觸修改。如需調整，請先解除鎖定。
  </div>

  <div class="panel">
    <div class="panel-title">一、調整可選刷卡護理師名單（輸入後按 Enter 或點新增，即會同步到雲端）</div>
    <div id="nurseTags" class="tag-list"></div>
    <div class="row-flex">
      <input id="newNurseInput" type="text" placeholder="輸入護理師名字，例如：王小明（按 Enter 可直接新增）" />
      <button id="addNurseBtn" type="button" class="primary">新增護理師</button>
      <button id="saveNurseCloudBtn" type="button" class="secondary">儲存名單到雲端</button>
    </div>
    <div class="note">屏東與排班規則：F、G 組為屏東組，選單僅提供「-- 未排 --」、「怡玫」及「其他（自行輸入名字）」；E 組可選所有人（含怡玫）；A～D 組只有在當天其他名字都被選走時才開放選取「怡玫」。人力不足時亦可勾選「允許跨組支援（人力吃緊）」。</div>
  </div>

  <div class="panel row-flex">
    <label>年份：<input id="yearInput" type="number" min="2020" max="2100" style="width: 85px;" /></label>
    <label>月份：
      <select id="monthInput">
        <option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option>
        <option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option>
        <option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option>
        <option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option>
      </select>
    </label>

    <span id="groupBadge" class="badge">目前組別：A～G（7組）</span>
    <button id="addGroupBtn" type="button" class="secondary">+ 增加組別</button>
    <button id="removeGroupBtn" type="button" class="secondary">- 減少組別</button>
    <label class="support-toggle" title="人力吃緊時開啟，允許同一天跨組支援並顯示警示">
      <input id="allowSupportToggle" type="checkbox" />
      允許跨組支援（人力吃緊）
    </label>
    <button id="lockToggleBtn" type="button" class="lock-btn unlocked">🔓 編輯中（點此鎖定唯讀）</button>
    <button id="reloadBtn" type="button" class="secondary">重新整理最新資料</button>
    <button id="clearMonthBtn" type="button" class="danger">清空本月排班</button>
    <span id="statusBadge" class="status">準備就緒</span>
  </div>

  <div class="panel">
    <div class="panel-title">二、國定假日（自動顯示常見國定假日，新增/移除會同步至雲端與本機）</div>
    <div class="row-flex" style="margin-bottom: 8px;">
      <input id="holidayDateInput" type="date" />
      <input id="holidayNameInput" type="text" placeholder="假日名稱，例如：春節 / 補假" />
      <button id="addHolidayBtn" type="button" class="primary">新增/更新假日</button>
    </div>
    <div id="monthHolidayTags" class="tag-list" style="margin-bottom: 0;"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="tableHeadRow"></tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx5fdOyJTZ5LFOev2v02fLaJkybxvRxj023QUaTPC53IvvbRL72YLt27sJGWvAX0O1B/exec";
    const PINGTUNG_NURSE = "怡玫";
    const PINGTUNG_GROUPS = new Set(["F", "G"]);      // 只能選怡玫（或臨時輸入）
    const PINGTUNG_OPEN_GROUPS = new Set(["E"]);      // 所有人都能選，且可直接選怡玫
    const CUSTOM_OPTION_VALUE = "__CUSTOM_INPUT__";

    const GROUP_COLORS = [
      { header: "#dcebe3", cell: "#f4f9f6" },
      { header: "#f7e5d2", cell: "#fdf8f2" },
      { header: "#dce8f5", cell: "#f3f8fd" },
      { header: "#f5dfe6", cell: "#fdf5f8" },
      { header: "#f3eed4", cell: "#fbf9ee" },
      { header: "#d9efec", cell: "#f2fbfa" },
      { header: "#e7e0f5", cell: "#f7f4fc" }
    ];

    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
    const BUILTIN_FIXED_HOLIDAYS = {
      "01-01": "元旦",
      "02-28": "和平紀念日",
      "04-04": "兒童節",
      "04-05": "清明節",
      "05-01": "勞動節",
      "10-10": "國慶日"
    };
    const BUILTIN_SPECIFIC_HOLIDAYS = {
      "2026-02-16": "除夕",
      "2026-02-17": "春節初一",
      "2026-02-18": "春節初二",
      "2026-02-19": "春節初三",
      "2026-02-20": "春節調整放假",
      "2026-04-03": "兒童節補假",
      "2026-06-19": "端午節",
      "2026-09-25": "中秋節"
    };

    let nurses = ["護理師A", "護理師B", "護理師C", "護理師D", "護理師E", "護理師F", "護理師G", PINGTUNG_NURSE];
    let groupCount = 7;
    let monthSchedule = {};
    let cloudHolidays = {};
    let allowCrossGroupSupport = false;
    let isLocked = false;
    let isSaving = false;

    const nurseTagsEl = document.getElementById("nurseTags");
    const newNurseInput = document.getElementById("newNurseInput");
    const yearInput = document.getElementById("yearInput");
    const monthInput = document.getElementById("monthInput");
    const groupBadge = document.getElementById("groupBadge");
    const statusBadge = document.getElementById("statusBadge");
    const holidayDateInput = document.getElementById("holidayDateInput");
    const holidayNameInput = document.getElementById("holidayNameInput");
    const monthHolidayTagsEl = document.getElementById("monthHolidayTags");
    const tableHeadRow = document.getElementById("tableHeadRow");
    const scheduleBody = document.getElementById("scheduleBody");
    const lockToggleBtn = document.getElementById("lockToggleBtn");
    const lockBanner = document.getElementById("lockBanner");
    const allowSupportToggle = document.getElementById("allowSupportToggle");

    const now = new Date();
    yearInput.value = now.getFullYear();
    monthInput.value = now.getMonth() + 1;

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function getYM() {
      return `${yearInput.value}-${pad2(monthInput.value)}`;
    }

    function getGroups() {
      const list = [];
      for (let i = 0; i < groupCount; i++) {
        list.push(String.fromCharCode(65 + i));
      }
      return list;
    }

    function getGroupColor(groupIndex) {
      return GROUP_COLORS[groupIndex % GROUP_COLORS.length];
    }

    function setStatus(text, type = "ok") {
      statusBadge.textContent = text;
      statusBadge.className = "status" + (type === "loading" ? " loading" : type === "err" ? " err" : "");
    }

    function applyLockUI() {
      lockBanner.classList.toggle("show", isLocked);
      if (isLocked) {
        lockToggleBtn.textContent = "🔒 已鎖定唯讀（點此解鎖）";
        lockToggleBtn.className = "lock-btn locked";
      } else {
        lockToggleBtn.textContent = "🔓 編輯中（點此鎖定唯讀）";
        lockToggleBtn.className = "lock-btn unlocked";
      }

      const editControls = [
        newNurseInput,
        document.getElementById("addNurseBtn"),
        document.getElementById("saveNurseCloudBtn"),
        document.getElementById("addGroupBtn"),
        document.getElementById("removeGroupBtn"),
        document.getElementById("clearMonthBtn"),
        holidayDateInput,
        holidayNameInput,
        document.getElementById("addHolidayBtn"),
        allowSupportToggle
      ];
      editControls.forEach(el => {
        if (el) el.disabled = isLocked;
      });
    }

    function loadLocalHolidays() {
      try {
        return JSON.parse(localStorage.getItem("custom_holidays_shared_v1") || "{}");
      } catch {
        return {};
      }
    }

    function saveLocalHolidays(obj) {
      localStorage.setItem("custom_holidays_shared_v1", JSON.stringify(obj));
    }

    function getMergedHolidays() {
      return { ...loadLocalHolidays(), ...cloudHolidays };
    }

    function getHolidayName(year, month, day) {
      const ymd = `${year}-${pad2(month)}-${pad2(day)}`;
      const md = `${pad2(month)}-${pad2(day)}`;
      const merged = getMergedHolidays();
      if (Object.prototype.hasOwnProperty.call(merged, ymd)) {
        return merged[ymd] || "";
      }
      if (BUILTIN_SPECIFIC_HOLIDAYS[ymd]) return BUILTIN_SPECIFIC_HOLIDAYS[ymd];
      if (BUILTIN_FIXED_HOLIDAYS[md]) return BUILTIN_FIXED_HOLIDAYS[md];
      return "";
    }

    function normalizeSchedule(raw, groups) {
      const result = {};
      if (!raw) return result;

      if (typeof raw === "object" && !Array.isArray(raw)) {
        Object.entries(raw).forEach(([key, val]) => {
          const dayMatch = String(key).match(/(\d{1,2})$/);
          if (!dayMatch || !val || typeof val !== "object") return;
          const dayKey = String(parseInt(dayMatch[1], 10));
          if (!result[dayKey]) result[dayKey] = {};
          Object.entries(val).forEach(([g, nurse]) => {
            const cleanGroup = String(g).replace("組", "").trim().toUpperCase();
            if (nurse) {
              result[dayKey][cleanGroup] = String(nurse).trim();
            }
          });
        });
        return result;
      }

      if (Array.isArray(raw)) {
        raw.forEach(row => {
          if (!row || typeof row !== "object") return;
          const rawDay = row.day ?? row.date ?? row.日期;
          if (!rawDay) return;
          const dayMatch = String(rawDay).match(/(\d{1,2})$/);
          if (!dayMatch) return;
          const dayKey = String(parseInt(dayMatch[1], 10));
          if (!result[dayKey]) result[dayKey] = {};

          if (row.group !== undefined || row.組別 !== undefined) {
            const g = String(row.group ?? row.組別).replace("組", "").trim().toUpperCase();
            const val = String(row.nurse ?? row.value ?? row.護理師 ?? "").trim();
            if (g && val) result[dayKey][g] = val;
          } else {
            groups.forEach(g => {
              const val = row[g] ?? row[`${g}組`];
              if (val) result[dayKey][g] = String(val).trim();
            });
          }
        });
      }
      return result;
    }

    async function callApiGet(silent = false) {
      if (!API_URL || API_URL.includes("請把剛剛複製的")) {
        setStatus("尚未填入網址", "err");
        renderAll();
        return;
      }
      if (isSaving && silent) return;

      if (!silent) setStatus("雲端同步中...", "loading");
      try {
        const ym = getYM();
        const url = `${API_URL}?ym=${encodeURIComponent(ym)}&_t=${Date.now()}`;
        const res = await fetch(url, { cache: "no-store" });
        const data = await res.json();

        if (data && (data.status === "ok" || data.ok === true || data.schedule || data.data)) {
          const staffSource = data.staffText ?? data.staff ?? data.nurses ?? "";
          if (Array.isArray(staffSource) && staffSource.length > 0) {
            nurses = staffSource.map(s => String(s).trim()).filter(Boolean);
          } else if (typeof staffSource === "string" && staffSource.trim()) {
            const parsed = staffSource
              .split(/[,、，\n]+/)
              .map(s => s.trim())
              .filter(Boolean);
            if (parsed.length > 0) nurses = parsed;
          }

          if (Number(data.groupCount) >= 1 && Number(data.groupCount) <= 26) {
            groupCount = Number(data.groupCount);
          }

          isLocked = Boolean(data.isLocked);

          const rawSchedule = data.schedule ?? data.data ?? data.rows ?? {};
          monthSchedule = normalizeSchedule(rawSchedule, getGroups());

          const rawHolidays = data.holidays ?? data.customHolidays;
          if (rawHolidays && typeof rawHolidays === "object" && !Array.isArray(rawHolidays)) {
            cloudHolidays = rawHolidays;
            saveLocalHolidays({ ...loadLocalHolidays(), ...cloudHolidays });
          }

          renderAll();
          setStatus(isLocked ? "已鎖定（僅檢視）" : "已與雲端同步");
        } else {
          throw new Error("讀取失敗");
        }
      } catch (e) {
        console.error(e);
        if (!silent) {
          setStatus("讀取失敗，請檢查網址", "err");
          renderAll();
        }
      }
    }

    async function callApiPost(payload, optionalFallback = false) {
      if (!API_URL || API_URL.includes("請把剛剛複製的")) {
        alert("請先在程式碼裡填入 Google Apps Script 網址！");
        return false;
      }
      isSaving = true;
      setStatus("儲存到雲端中...", "loading");
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data && data.status === "locked") {
          isLocked = true;
          applyLockUI();
          renderTable();
          setStatus("目前已鎖定唯讀", "err");
          return false;
        }
        if (data && (data.status === "ok" || data.ok === true)) {
          setStatus(isLocked ? "已鎖定（僅檢視）" : "已儲存到雲端");
          return true;
        }
        throw new Error("寫入失敗");
      } catch (e) {
        console.error(e);
        if (optionalFallback) {
          setStatus("已更新（本機同步）");
          return false;
        }
        setStatus("儲存失敗，請重試", "err");
        return false;
      } finally {
        isSaving = false;
      }
    }

    async function addNurseAction() {
      if (isLocked) return;
      const name = newNurseInput.value.trim();
      if (!name) return;
      if (nurses.includes(name)) {
        alert("名單裡已經有這個名字囉！");
        return;
      }
      nurses.push(name);
      newNurseInput.value = "";
      renderNurseTags();
      renderTable();
      await callApiPost({ action: "saveStaff", staffText: nurses.join(", ") });
    }

    function renderNurseTags() {
      nurseTagsEl.innerHTML = "";
      nurses.forEach((name, idx) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = name;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "×";
        btn.title = "移除";
        btn.disabled = isLocked;
        btn.addEventListener("click", async () => {
          if (isLocked) return;
          nurses = nurses.filter((_, i) => i !== idx);
          renderNurseTags();
          renderTable();
          await callApiPost({ action: "saveStaff", staffText: nurses.join(", ") });
        });

        span.appendChild(btn);
        nurseTagsEl.appendChild(span);
      });
    }

    function renderMonthHolidays() {
      const year = parseInt(yearInput.value, 10);
      const month = parseInt(monthInput.value, 10);
      if (!year || !month) return;

      const daysInMonth = new Date(year, month, 0).getDate();
      const list = [];
      for (let day = 1; day <= daysInMonth; day++) {
        const hName = getHolidayName(year, month, day);
        if (hName) {
          list.push({ day, ymd: `${year}-${pad2(month)}-${pad2(day)}`, hName });
        }
      }

      monthHolidayTagsEl.innerHTML = "";
      if (list.length === 0) {
        monthHolidayTagsEl.innerHTML = '<span style="color:#888;font-size:13px;">本月無國定假日</span>';
        return;
      }

      list.forEach(item => {
        const span = document.createElement("span");
        span.className = "tag holiday-tag";
        span.textContent = `${month}/${item.day} ${item.hName}`;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "×";
        btn.disabled = isLocked;
        btn.addEventListener("click", async () => {
          if (isLocked) return;
          const localH = loadLocalHolidays();
          localH[item.ymd] = "";
          cloudHolidays[item.ymd] = "";
          saveLocalHolidays(localH);
          renderMonthHolidays();
          renderTable();
          await callApiPost({ action: "saveHoliday", date: item.ymd, name: "" }, true);
        });

        span.appendChild(btn);
        monthHolidayTagsEl.appendChild(span);
      });
    }

    function renderTable() {
      const year = parseInt(yearInput.value, 10);
      const month = parseInt(monthInput.value, 10);
      if (!year || !month) return;

      const groups = getGroups();
      groupBadge.textContent = groups.length === 1
        ? `目前組別：${groups[0]}（1組）`
        : `目前組別：${groups[0]}～${groups[groups.length - 1]}（${groups.length}組）`;

      tableHeadRow.innerHTML = `
        <th style="width: 82px;">日期</th>
        <th style="width: 68px;">星期</th>
        ${groups.map((g, idx) => {
          const color = getGroupColor(idx);
          const ptTag = PINGTUNG_GROUPS.has(g) ? `<div style="font-size:11px;color:#92400e;">（屏東）</div>` : "";
          return `<th style="background:${color.header}; color:#1e293b;">${g} 組${ptTag}</th>`;
        }).join("")}
        <th style="width: 190px;">當日剩餘可用人力</th>
      `;

      const daysInMonth = new Date(year, month, 0).getDate();
      scheduleBody.innerHTML = "";

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month - 1, day);
        const wIdx = d.getDay();
        const isWeekend = wIdx === 0 || wIdx === 6;
        const holidayName = getHolidayName(year, month, day);
        const dayStr = String(day);

        if (!monthSchedule[dayStr]) monthSchedule[dayStr] = {};
        const dayData = monthSchedule[dayStr];

        const countsByNurse = {};
        groups.forEach(g => {
          const val = dayData[g];
          if (val) countsByNurse[val] = (countsByNurse[val] || 0) + 1;
        });

        const tr = document.createElement("tr");
        if (holidayName) tr.classList.add("holiday");
        else if (isWeekend) tr.classList.add("weekend");

        const tdDate = document.createElement("td");
        tdDate.textContent = `${month}/${day}`;
        if (holidayName) {
          const hSpan = document.createElement("span");
          hSpan.className = "holiday-name";
          hSpan.textContent = holidayName;
          tdDate.appendChild(hSpan);
        }
        tr.appendChild(tdDate);

        const tdWeek = document.createElement("td");
        tdWeek.textContent = `週${WEEKDAYS[wIdx]}`;
        tr.appendChild(tdWeek);

        groups.forEach((group, groupIdx) => {
          const color = getGroupColor(groupIdx);
          const td = document.createElement("td");
          const isPtGroup = PINGTUNG_GROUPS.has(group);
          td.style.backgroundColor = color.cell;

          const select = document.createElement("select");
          select.style.backgroundColor = "#ffffffcc";

          const currentVal = dayData[group] || "";
          const isDuplicateToday = Boolean(currentVal) && (countsByNurse[currentVal] || 0) > 1;
          if (isDuplicateToday) {
            td.classList.add("conflict-cell");
          }

          const takenByOthers = new Set();
          groups.forEach(g => {
            if (g !== group && dayData[g]) {
              takenByOthers.add(dayData[g]);
            }
          });

          const blankOpt = document.createElement("option");
          blankOpt.value = "";
          blankOpt.textContent = "-- 未排 --";
          if (!currentVal) blankOpt.selected = true;
          select.appendChild(blankOpt);

          if (isPtGroup) {
            // F、G 組（屏東）：僅提供「-- 未排 --」、「怡玫」及「其他（自行輸入名字）...」
            const isYimeiTaken = takenByOthers.has(PINGTUNG_NURSE) && currentVal !== PINGTUNG_NURSE;
            if (!isYimeiTaken || allowCrossGroupSupport) {
              const yimeiOpt = document.createElement("option");
              yimeiOpt.value = PINGTUNG_NURSE;
              yimeiOpt.textContent = isYimeiTaken ? `${PINGTUNG_NURSE}（已排/支援）` : PINGTUNG_NURSE;
              if (currentVal === PINGTUNG_NURSE) yimeiOpt.selected = true;
              select.appendChild(yimeiOpt);
            }

            // 若目前存有自行輸入的名字（非空且非怡玫），顯示在選單中並選取
            if (currentVal && currentVal !== PINGTUNG_NURSE) {
              const customCurrentOpt = document.createElement("option");
              customCurrentOpt.value = currentVal;
              customCurrentOpt.textContent = `${currentVal}（臨時）`;
              customCurrentOpt.selected = true;
              select.appendChild(customCurrentOpt);
            }

            const customTriggerOpt = document.createElement("option");
            customTriggerOpt.value = CUSTOM_OPTION_VALUE;
            customTriggerOpt.textContent = "＋ 其他（自行輸入名字）...";
            select.appendChild(customTriggerOpt);
          } else {
            // 其他組：A～D 只有在其他名字都被選走時才開放「怡玫」；E 組不受此限制
            const otherNames = nurses.filter(n => n !== PINGTUNG_NURSE);
            const allOtherNamesTaken =
              otherNames.length > 0 && otherNames.every(n => takenByOthers.has(n));

            const choices = [...nurses];
            if (currentVal && !choices.includes(currentVal)) {
              choices.unshift(currentVal);
            }

            choices.forEach(name => {
              if (
                name === PINGTUNG_NURSE &&
                !PINGTUNG_OPEN_GROUPS.has(group) &&
                !allOtherNamesTaken &&
                name !== currentVal
              ) {
                return;
              }

              const isTaken = takenByOthers.has(name) && name !== currentVal;
              if (isTaken && !allowCrossGroupSupport) return;

              const opt = document.createElement("option");
              opt.value = name;
              opt.textContent = isTaken ? `${name}（已排/支援）` : name;
              if (name === currentVal) opt.selected = true;
              select.appendChild(opt);
            });
          }

          select.disabled = isLocked;

          select.addEventListener("change", async () => {
            if (isLocked) return;
            let nextVal = select.value;

            if (isPtGroup && nextVal === CUSTOM_OPTION_VALUE) {
              const inputName = prompt(`請輸入 ${month}/${day} ${group} 組臨時支援人員名字：`, "");
              if (!inputName || !inputName.trim()) {
                // 使用者取消輸入，恢復原本選取狀態
                renderTable();
                return;
              }
              nextVal = inputName.trim();
            }

            if (!monthSchedule[dayStr]) monthSchedule[dayStr] = {};
            monthSchedule[dayStr][group] = nextVal;
            renderTable();
            await callApiPost({
              action: "saveCell",
              ym: getYM(),
              day: dayStr,
              group,
              value: nextVal
            });
          });

          td.appendChild(select);

          if (isPtGroup && currentVal && currentVal !== PINGTUNG_NURSE) {
            const customSpan = document.createElement("span");
            customSpan.className = "custom-note";
            customSpan.textContent = "臨時指定人員";
            td.appendChild(customSpan);
          }

          if (isDuplicateToday) {
            const warnSpan = document.createElement("span");
            warnSpan.className = "conflict-note";
            warnSpan.textContent = "⚠ 跨組支援中";
            td.appendChild(warnSpan);
          }

          tr.appendChild(td);
        });

        // 當日剩餘可用人力提示欄
        const tdAvail = document.createElement("td");
        tdAvail.className = "avail-cell";
        const available = nurses.filter(n => !countsByNurse[n]);
        const conflicts = Object.entries(countsByNurse)
          .filter(([, cnt]) => cnt > 1)
          .map(([name, cnt]) => `${name}×${cnt}`);

        if (available.length > 0) {
          tdAvail.innerHTML += `<div>剩餘（${available.length}）：${available.join("、")}</div>`;
        } else {
          tdAvail.innerHTML += `<div class="avail-empty">剩餘（0）：已無空閒人力</div>`;
        }

        if (conflicts.length > 0) {
          tdAvail.innerHTML += `<div class="conflict-note">支援警示：${conflicts.join("、")}</div>`;
        }
        tr.appendChild(tdAvail);

        scheduleBody.appendChild(tr);
      }
    }

    function renderAll() {
      applyLockUI();
      renderNurseTags();
      renderMonthHolidays();
      renderTable();
    }

    allowSupportToggle.addEventListener("change", () => {
      if (isLocked) {
        allowSupportToggle.checked = allowCrossGroupSupport;
        return;
      }
      allowCrossGroupSupport = allowSupportToggle.checked;
      renderTable();
    });

    lockToggleBtn.addEventListener("click", async () => {
      const targetLock = !isLocked;
      const ok = await callApiPost({ action: "setLocked", isLocked: targetLock });
      if (ok) {
        isLocked = targetLock;
        renderAll();
      }
    });

    document.getElementById("addNurseBtn").addEventListener("click", addNurseAction);
    newNurseInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        await addNurseAction();
      }
    });

    document.getElementById("saveNurseCloudBtn").addEventListener("click", async () => {
      if (isLocked) return;
      await callApiPost({ action: "saveStaff", staffText: nurses.join(", ") });
    });

    document.getElementById("addGroupBtn").addEventListener("click", async () => {
      if (isLocked || groupCount >= 26) return;
      groupCount += 1;
      renderTable();
      await callApiPost({ action: "setGroupCount", groupCount });
    });

    document.getElementById("removeGroupBtn").addEventListener("click", async () => {
      if (isLocked) return;
      if (groupCount <= 1) {
        alert("至少要保留 1 組喔！");
        return;
      }
      groupCount -= 1;
      renderTable();
      await callApiPost({ action: "setGroupCount", groupCount });
    });

    document.getElementById("addHolidayBtn").addEventListener("click", async () => {
      if (isLocked) return;
      const dateVal = holidayDateInput.value;
      const nameVal = holidayNameInput.value.trim() || "國定假日";
      if (!dateVal) {
        alert("請先選擇日期！");
        return;
      }
      const localH = loadLocalHolidays();
      localH[dateVal] = nameVal;
      cloudHolidays[dateVal] = nameVal;
      saveLocalHolidays(localH);
      holidayNameInput.value = "";
      renderMonthHolidays();
      renderTable();
      await callApiPost({ action: "saveHoliday", date: dateVal, name: nameVal }, true);
    });

    document.getElementById("reloadBtn").addEventListener("click", () => callApiGet(false));
    yearInput.addEventListener("change", () => callApiGet(false));
    monthInput.addEventListener("change", () => callApiGet(false));

    document.getElementById("clearMonthBtn").addEventListener("click", async () => {
      if (isLocked) return;
      if (!confirm(`確定要清空 ${yearInput.value} 年 ${monthInput.value} 月的排班嗎？`)) return;
      monthSchedule = {};
      renderTable();
      await callApiPost({ action: "clearMonth", ym: getYM() });
    });

    setInterval(() => {
      const activeTag = document.activeElement ? document.activeElement.tagName : "";
      if (activeTag === "SELECT" || activeTag === "INPUT") return;
      callApiGet(true);
    }, 15000);

    callApiGet(false);
  </script>
</body>
</html>
